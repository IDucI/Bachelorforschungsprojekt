[build-system]
requires = ["setuptools >= 64.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
description="descr"
name="cross"
requires-python=">=3.10"
dependencies = [] # "loguru"
readme="README.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["cross"]

[tool.setuptools.dynamic]
version = {attr = "__version__"}
